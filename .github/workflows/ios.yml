# Build iOS gratuita: compila sul runner macOS di GitHub (gratis per i repo pubblici) con
# `eas build --local`, che NON consuma le build cloud di Expo. Le credenziali di firma
# (certificato + provisioning) restano custodite da EAS: qui serve solo EXPO_TOKEN.
# Facoltativo: con `submit: true` l'.ipa va su TestFlight via `eas submit`
# (chiave API di App Store Connect configurata in EAS, `npx eas-cli credentials`).
name: iOS build

on:
  workflow_dispatch:
    inputs:
      profile:
        description: Profilo EAS (production = App Store/TestFlight, preview = installazione interna)
        default: production
        type: choice
        options: [production, preview]
      submit:
        description: Invia a TestFlight al termine
        default: false
        type: boolean

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Xcode più recente
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Token Expo presente
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          if [ -z "$EXPO_TOKEN" ]; then
            echo "::error::Manca il segreto EXPO_TOKEN: crealo su expo.dev (Access tokens) e aggiungilo in Settings > Secrets and variables > Actions."
            exit 1
          fi

      - name: Dipendenze
        run: npm ci

      - name: Controlli (tipi e lint)
        run: |
          npx tsc --noEmit
          npx eslint src

      - name: Build iOS locale (runner GitHub)
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: npx eas-cli@latest build --platform ios --profile ${{ inputs.profile }} --local --non-interactive --output ${{ github.workspace }}/jsync.ipa

      - uses: actions/upload-artifact@v7
        with:
          name: jsync-ios-${{ inputs.profile }}
          path: jsync.ipa
          retention-days: 14

      - name: Invio a TestFlight
        if: ${{ inputs.submit }}
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: npx eas-cli@latest submit --platform ios --path jsync.ipa --non-interactive
