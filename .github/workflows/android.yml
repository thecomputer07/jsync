# Build Android gratuita sul runner Linux di GitHub con `eas build --local` (nessuna build cloud).
# preview = APK da installare a mano, production = AAB per Google Play, tv = APK Android TV.
name: Android build

on:
  workflow_dispatch:
    inputs:
      profile:
        description: Profilo EAS
        default: preview
        type: choice
        options: [preview, production, tv]

concurrency:
  group: android-${{ github.ref }}-${{ inputs.profile }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: android-actions/setup-android@v3

      - name: Dipendenze
        run: npm ci

      - name: Build Android locale (runner GitHub)
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          EXPO_TV: ${{ inputs.profile == 'tv' && '1' || '' }}
        run: npx eas-cli@latest build --platform android --profile ${{ inputs.profile }} --local --non-interactive --output ${{ github.workspace }}/jsync-${{ inputs.profile }}.${{ inputs.profile == 'production' && 'aab' || 'apk' }}

      - uses: actions/upload-artifact@v4
        with:
          name: jsync-android-${{ inputs.profile }}
          path: jsync-*
          retention-days: 14
